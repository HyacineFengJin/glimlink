# SPDX-License-Identifier: MIT
name: glimlink
x-runtime: &runtime
  image: glimlink:0.1.0-alpha.2
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  mem_reservation: 384m
  memswap_limit: 512m
  cpus: 1.0
  pids_limit: 128
  stop_grace_period: 30s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
  volumes:
    - /var/lib/glimlink/state:/state
    - /opt/glimlink/engines:/engines:ro
  logging:
    driver: local
    options:
      max-size: 5m
      max-file: "2"
services:
  runtime:
    <<: *runtime
    container_name: glimlink-runtime
    restart: unless-stopped
  control:
    <<: *runtime
    profiles: [manual]
    restart: "no"
    command: ["--state", "/state", "doctor"]
  management:
    <<: *runtime
    profiles: [manual]
    restart: "no"
    mem_limit: 96m
    mem_reservation: 16m
    memswap_limit: 96m
    cpus: 0.25
    pids_limit: 32
    command: ["--state", "/state", "operator", "manage"]
