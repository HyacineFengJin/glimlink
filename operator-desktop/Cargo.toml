[workspace]
resolver = "3"

[package]
name = "agent-operator-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
build = "build.rs"

[features]
# Synthetic native acceptance only. No fixture hooks exist in the normal binary.
x-login-fixture = []

[[bin]]
name = "x-login-fixture"
path = "src/bin/x-login-fixture.rs"
required-features = ["x-login-fixture"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "x11", "custom-protocol"] }
runtime-operator = { path = "../crates/runtime-operator" }
runtime-control = { path = "../crates/runtime-control", features = ["human-ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
