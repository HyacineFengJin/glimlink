[package]
name = "platform-qq"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[dependencies]
base64 = "0.22.1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10.3"
p256 = { version = "0.13.2", default-features = false, features = ["ecdh", "std"] }
sha2 = "0.10.9"
md-5 = "0.10"
sha1 = { version = "0.10", features = ["compress"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
