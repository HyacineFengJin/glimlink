[package]
license = "MIT"
name = "runtime-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "engine-fake-server"
path = "src/bin/fake_server.rs"
required-features = ["test-helper"]

[[bin]]
name = "antigravity-fake-server"
path = "src/bin/antigravity_fake_server.rs"
required-features = ["test-helper"]

[[bin]]
name = "engine-login-fixture"
path = "src/bin/login_fixture.rs"
required-features = ["test-helper"]

[features]
default = []
test-helper = []
