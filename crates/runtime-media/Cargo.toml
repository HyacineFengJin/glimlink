[package]
name = "runtime-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"

[dependencies]
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "mp3", "wav", "ogg", "vorbis", "pcm", "isomp4"] }
nihav_core = { path = "vendor/nihav-core" }
nihav_itu = { path = "vendor/nihav-itu", default-features = false, features = ["decoder_h264", "simd"] }
nihav_commonfmt = { path = "vendor/nihav-commonfmt", default-features = false, features = ["demuxer_mov"] }

runtime-amr-codec = { path = "vendor/rvoip-amr" }
runtime-silk = { path = "vendor/runtime-silk" }
