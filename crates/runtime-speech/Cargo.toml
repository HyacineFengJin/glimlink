[package]
name = "runtime-speech"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"

[dependencies]
rayon = "=1.12.0"
candle-core = { version = "=0.9.1", default-features = false }
candle-nn = { version = "=0.9.1", default-features = false }
candle-transformers = { version = "=0.9.1", default-features = false }
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
tracing = "=0.1.44"
libc = "0.2"
