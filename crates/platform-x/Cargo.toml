[package]
name = "platform-x"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"

[dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
sha2 = "0.10"
regex = "1"
getrandom = "0.2"
