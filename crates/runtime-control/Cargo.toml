[package]
name = "runtime-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Bounded operator protocol for Agent Runtime"

[features]
default = []
human-ui = ["dep:getrandom", "dep:qrcode"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
getrandom = { version = "0.3.4", optional = true }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"], optional = true }
